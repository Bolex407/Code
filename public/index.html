<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pay securely</title>
<style>
  :root{color-scheme:light; --bg:#ffffff; --card:#ffffff; --ink:#111111; --muted:#5f625f; --line:#e3e4e0; --accent:#01BE64; --accent2:#FCA403; --accent-ink:#111111; --err:#c0261c;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Georgia,"Times New Roman",serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .logo{margin:0 0 20px}
  .logo img{display:block;width:230px;max-width:70%;height:auto}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .wrap{width:100%;max-width:440px}
  h1{font-size:28px;line-height:1.2;margin:0 0 6px;font-weight:700}
  .sub{color:var(--muted);margin:0 0 24px;font-family:system-ui,sans-serif;font-size:15px}
  form{background:var(--card);border:1px solid var(--line);border-top:4px solid var(--accent2);border-radius:14px;padding:24px;box-shadow:0 2px 14px rgba(17,17,17,.06)}
  label{display:block;font:600 14px system-ui,sans-serif;margin:0 0 6px}
  input,select{width:100%;padding:12px 14px;font:16px system-ui,sans-serif;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;margin-bottom:16px}
  select{background:var(--card)}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
  .amt{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;margin-bottom:10px}
  .amt span{padding:0 4px 0 14px;font:600 20px system-ui,sans-serif}
  .amt input{border:0;margin:0;font-size:22px;font-weight:600}
  .hint{color:var(--muted);font:13px system-ui,sans-serif;margin:-2px 0 18px;min-height:18px}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
  .chip{padding:8px 12px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;font:14px system-ui,sans-serif;cursor:pointer}
  .chip:hover{border-color:var(--accent)}
  .pay{width:100%;padding:14px;border:0;border-radius:8px;background:var(--accent);color:var(--accent-ink);font:600 17px system-ui,sans-serif;cursor:pointer}
  .pay:hover{filter:brightness(.95)}
  .pay:disabled{opacity:.6;cursor:wait}
  .msg{font:14px system-ui,sans-serif;margin:12px 0 0;min-height:20px}
  .msg.err{color:var(--err)} .msg.ok{color:#087a43}
  .foot{text-align:center;color:var(--muted);font:13px system-ui,sans-serif;margin-top:16px}
</style>
</head>

    tiers: [
      { status: "Member",           price: 5000 },
      { status: "Distributor",      price: 10000 },
      { status: "Manager",          price: 20000 },
      { status: "Senior Manager",   price: 30000 },
      { status: "Executive Manager",price: 50000 },
      { status: "Director",         price: 100000 },
      { status: "World-Team",        price: null }
    ],
    successUrl: null                                 // optional, e.g. "https://yoursite.com/thank-you"
  };
  // ========================

  var $ = function(id){ return document.getElementById(id); };
  $("biz").textContent = CONFIG.businessName;
  document.title = "Pay " + CONFIG.businessName;

  function setMsg(t, cls){ $("msg").textContent = t; $("msg").className = "msg " + (cls||""); }

  var sel = $("status");
  var ph = document.createElement("option");
  ph.value = ""; ph.textContent = "Select your status"; sel.appendChild(ph);
  CONFIG.tiers.forEach(function(t){
    var o = document.createElement("option");
    o.value = t.status;
    o.textContent = t.price ? t.status + " (₦" + t.price.toLocaleString("en-NG") + ")" : t.status;
    sel.appendChild(o);
  });
  function tierOf(v){ return CONFIG.tiers.filter(function(t){ return t.status === v; })[0]; }
  sel.addEventListener("change", function(){
    var t = tierOf(sel.value), a = $("amount");
    if (t && t.price) { a.value = t.price; a.readOnly = true; $("hint").textContent = "Fixed amount for " + t.status + "."; }
    else { a.value = ""; a.readOnly = false; $("hint").textContent = t ? "Enter the amount you are paying." : ""; }
  });

  $("f").addEventListener("submit", function(e){
    e.preventDefault();
    var name = $("name").value.trim(), email = $("email").value.trim(),
        phone = $("phone").value.trim(), amount = parseFloat($("amount").value);

    var tier = tierOf(sel.value);
    if (!name) return setMsg("Enter your full name.", "err");
    if (!tier) return setMsg("Select your status.", "err");
    if (!/^\S+@\S+\.\S+$/.test(email)) return setMsg("Enter a valid email address.", "err");
    if (tier.price) amount = tier.price;
    if (!amount || amount < 100) return setMsg("Enter an amount of at least ₦100.", "err");
    if (typeof PaystackPop === "undefined") return setMsg("Paystack could not load. Check your connection and refresh.", "err");

    setMsg(""); $("btn").disabled = true;

    var handler = PaystackPop.setup({
      key: CONFIG.publicKey,
      email: email,
      amount: Math.round(amount * 100),   // Paystack expects kobo
      currency: CONFIG.currency,
      ref: "PAY-" + tier.status.replace(/[^A-Za-z]/g,"").toUpperCase().slice(0,6) + "-" + Date.now() + "-" + Math.floor(Math.random()*1e6),
      metadata: { custom_fields: [
        { display_name: "Customer name", variable_name: "customer_name", value: name },
        { display_name: "Status", variable_name: "status", value: tier.status },
        { display_name: "Phone", variable_name: "phone", value: phone }
      ]},
      callback: function(res){
        $("btn").disabled = false;
        if (CONFIG.successUrl) { window.location.href = CONFIG.successUrl + "?reference=" + encodeURIComponent(res.reference); return; }
        $("f").reset(); $("amount").readOnly = false; $("hint").textContent = "";
        setMsg("Payment received. Reference: " + res.reference + ". Your ticket with a QR code will be emailed to you shortly.", "ok");
      },
      onClose: function(){
        $("btn").disabled = false;
        setMsg("Payment window closed. You have not been charged.", "err");
      }
    });
    handler.openIframe();
  });
</script>
</body>
</html>
